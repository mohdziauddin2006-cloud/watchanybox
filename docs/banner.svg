<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">WatchAnyBox</title>
  <desc id="bannerDesc">One player, every screen, zero ads.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07070C"/>
      <stop offset="0.55" stop-color="#0A0911"/>
      <stop offset="1" stop-color="#120A18"/>
    </linearGradient>

    <radialGradient id="glowPink" cx="1010" cy="30" r="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EC4899" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowViolet" cx="250" cy="330" r="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accent" x1="430" y1="120" x2="650" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F472B6"/>
      <stop offset="0.52" stop-color="#EC4899"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="stroke" x1="96" y1="92" x2="192" y2="188" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F472B6"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#glowPink)"/>
  <rect width="1200" height="320" fill="url(#glowViolet)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" stroke="#FFFFFF" stroke-opacity="0.06"/>

  <!-- App mark -->
  <rect x="96" y="92" width="96" height="96" rx="26" fill="#11111B" stroke="url(#stroke)" stroke-width="2"/>
  <path d="M130.5 122.8c0-2.7 2.9-4.4 5.2-3.1l29.8 17.2c2.3 1.3 2.3 4.7 0 6l-29.8 17.2c-2.3 1.3-5.2-.4-5.2-3.1v-34.2Z" fill="url(#accent)"/>
  <circle cx="181" cy="110" r="4" fill="#F472B6"/>

  <!-- Wordmark -->
  <text x="220" y="92" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="4.2" fill="#8B8BA3">OPEN SOURCE · CROSS-PLATFORM</text>
  <text x="220" y="176" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="66" font-weight="800" letter-spacing="-2.5" fill="#FFFFFF">Watch</text>
  <text x="428" y="176" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="66" font-weight="800" letter-spacing="-2.5" fill="url(#accent)">AnyBox</text>
  <text x="221" y="224" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="18" font-weight="600" letter-spacing="2.4" fill="#C9C9D6">ONE PLAYER · EVERY SCREEN · ZERO ADS</text>
  <text x="221" y="260" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="15" font-weight="500" fill="#6F6F85">Electron · Jetpack Compose · Embedded Node.js engine</text>

  <!-- Devices -->
  <g opacity="0.96">
    <rect x="852" y="72" width="216" height="138" rx="18" fill="#0D0D16" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <rect x="866" y="86" width="188" height="110" rx="10" fill="#08080E"/>
    <path d="M946 124.8c0-4.2 4.6-6.9 8.2-4.7l21 12.4c3.6 2.1 3.6 7.3 0 9.4l-21 12.4c-3.6 2.2-8.2-.5-8.2-4.7v-24.8Z" fill="url(#accent)" opacity="0.9"/>
    <rect x="950" y="210" width="20" height="14" rx="3" fill="#15151F"/>
    <rect x="924" y="224" width="72" height="7" rx="3.5" fill="#1B1B27"/>

    <rect x="1092" y="108" width="64" height="132" rx="14" fill="#0D0D16" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <rect x="1098" y="116" width="52" height="116" rx="9" fill="#08080E"/>
    <rect x="1113" y="110" width="22" height="4" rx="2" fill="#22222E"/>
    <path d="M1114 158.4c0-2.9 3.1-4.7 5.6-3.2l16 9.4c2.5 1.4 2.5 5 0 6.4l-16 9.4c-2.5 1.5-5.6-.3-5.6-3.2v-18.8Z" fill="url(#accent)" opacity="0.85"/>
  </g>

  <path d="M0 319H1200" stroke="#FFFFFF" stroke-opacity="0.04"/>
</svg>
